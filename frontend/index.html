<!DOCTYPE html>
<html>
<head>
<title>Medusa-X</title>
<style>
body{font-family:Arial;text-align:center;padding:50px;background:#f5f5f5}
.card{background:white;padding:20px;margin:10px auto;max-width:300px;border-radius:10px;box-shadow:0 2px 8px #ccc}
button{background:black;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer}
</style>
</head>
<body>
<h1>🛍️ Medusa-X Store</h1>
<p>Backend: <span id="status">Checking...</span></p>
<div id="products"></div>
<script>
fetch('http://localhost:5000/api/products')
.then(r=>r.json()).then(data=>{
 document.getElementById('status').innerText='Connected ✅';
 document.getElementById('products').innerHTML=data.map(p=>`<div class="card"><h3>${p.name}</h3><p>₹${p.price}</p><button>Add to Cart</button></div>`).join('');
}).catch(()=>{document.getElementById('status').innerText='Backend not running - start it with npm run dev'});
</script>
</body>
</html>
